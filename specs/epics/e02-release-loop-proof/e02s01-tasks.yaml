story_id: e02s01
title: "fix: patch release on production"
status: done
bcps: 4
tasks:
  - id: 1
    description: "patch tag is greater than previous minor baseline"
    verify: "git fetch --tags -q 2>/dev/null; test $(git tag -l 'v*' | wc -l) -ge 2"
    risk: P1
    status: done
  - id: 2
    description: "VERSION matches latest tag"
    verify: "v=$(git describe --tags --abbrev=0); test "$(cat VERSION)" = "${v#v}""
    risk: P1
    status: done
  - id: 3
    description: "Smoke shows VERSION on node.danielvm.net"
    verify: "ver=$(cat VERSION); curl -sfS https://node.danielvm.net/ | rg -q "v$ver""
    risk: P0
    status: done
